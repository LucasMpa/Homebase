# Aplica as migrations de supabase/migrations no Supabase Cloud a cada push na
# main que traga migration nova (a Vercel só publica o app, não mexe no banco).
#
# Configuração no GitHub (Settings → Secrets and variables → Actions):
#   Secrets
#     SUPABASE_ACCESS_TOKEN  token pessoal: supabase.com/dashboard/account/tokens
#     SUPABASE_DB_PASSWORD   opcional. Sem ela, o CLI usa o token para criar um
#                            login temporário no banco (como no `supabase` local).
#   Variables
#     SUPABASE_PROJECT_REF   ref do projeto (o "xxxx" de https://xxxx.supabase.co)
#
# Também dá para rodar na mão em Actions → "Supabase migrations" → Run workflow.

name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

# Nunca dois `db push` ao mesmo tempo; um novo espera o anterior terminar.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir configuração
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Configure no GitHub:$missing (veja o topo deste arquivo)."
            exit 1
          fi

      # Mesma versão da devDependency `supabase` do package.json.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # A senha só é exportada se o secret existir: vazia, o CLI tentaria usá-la.
      - name: Senha do banco (opcional)
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            echo "::add-mask::$DB_PASSWORD"
            echo "SUPABASE_DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
            echo "Usando SUPABASE_DB_PASSWORD."
          else
            echo "Sem SUPABASE_DB_PASSWORD: login temporário via access token."
          fi

      - name: Vincular projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations pendentes
        run: supabase migration list

      - name: Aplicar migrations
        run: supabase db push --yes
